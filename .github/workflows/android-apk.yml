name: Build Android APK

# Builds an installable APK that opens the hosted gestionauto site inside the app.
# Needs the repository variable APP_URL (the public https address of the site).
# Run it from the Actions tab: "Build Android APK" > "Run workflow".

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check APP_URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Set the repository variable APP_URL first"; exit 1; fi
          case "$APP_URL" in https://*) ;; *) echo "APP_URL must start with https://"; exit 1;; esac
          sed -i "s|__APP_URL__|$APP_URL|" capacitor.config.json

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gestionauto-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
